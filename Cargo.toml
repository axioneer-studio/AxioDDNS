[package]
name = "axioddns"
version = "3.0.0"
edition = "2021"
description = "Service de mise à jour DNS dynamique pour Infomaniak (Rust)"
authors = ["axioneer-studio"]
license = "MIT"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15"
ctrlc = "3.4"
log = "0.4"
env_logger = "0.11"
serde_json = "1.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
