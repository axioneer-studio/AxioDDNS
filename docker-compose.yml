services:
  ddns:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axioddns
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    healthcheck:
      test: ["CMD", "pgrep", "axioddns"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

